---
- name: update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
  when: baseline_upgrade_all

- name: Ensure Telnet not installed
  ansible.builtin.package:
    name: telnet
    state: absent

- name: disable ctrl-alt-del
  ansible.builtin.systemd:
    name: ctrl-alt-del.target
    masked: true
  notify: Systemd_daemon_reload

- name: Audit vendor-supported release
  ansible.builtin.debug:
    msg: "System is running a vendor supported release as per assert checks at the beginning of the playbook - {{ ansible_facts.distribution }} {{ ansible_facts.distribution_major_version }}"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ baseline_packages }}"
    state: present

- name: Create Users
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.count | default(omit) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    state: present
  loop: "{{ baseline_users }}"

- name: Deploy MOTD
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: '0644'

- name: Ensure timezone is set
  community.general.timezone:
    name: America/Los_Angeles
  notify: Restart cron

