---
- name: RHEL 10 STIG audit
  hosts: all
  become: true
  vars:
    ds_file: /usr/share/xml/scap/ssg/content/ssg-rhel10-ds.xml
    profile: xccdf_org.ssgproject.content_profile_stig
    outdir: /tmp/stig-audit

  tasks:
    - name: Install scanner and content
      ansible.builtin.dnf:
        name:
          - openscap-scanner
          - scap-security-guide
        state: present

    - name: Create output dir
      ansible.builtin.file:
        path: "{{ outdir }}"
        state: directory

    - name: Run STIG scan
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ profile }}
        --results {{ outdir}}/results.xccdf.xml
        --results-arf {{ outdir }}/results-arf.xml
        --stig-viewer {{ outdir }}/results-stigviewer.xml
        --report {{ outdir }}/report.html
        {{ ds_file }}
      register: scan
      changed_when: false
      failed_when: scan.rc not in [0, 2]

    - name: Pull results back to controller
      ansible.builtin.fetch:
        src: "{{ outdir }}/{{ item }}"
        dest: "audit-results/{{ inventory_hostname }}/"
        flat: true
      loop:
        - results-xccdf.xml
        - results-stigviewer.vml
        - report.html
