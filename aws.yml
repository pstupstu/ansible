---
- name: Provision build instance
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: us-west-1
    key_name: ansible-lab
    instance_type: t3.micro
    vpc_subnet_id: subnet-dc86a2b8
    sg_id: sg-014c8a854437e8d33

  tasks:
    - name: Find latest Ubuntu 24.04 AMI
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: "099720109477"
        filters:
          name: "ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-amd64-server-*"
          state: available
      register: ami_search

    - name: Set latest Ubuntu AMI id
      ansible.builtin.set_fact:
        base_ami: "{{ (ami_search.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Show AMI id
      ansible.builtin.debug:
        msg: "{{ base_ami }}"

    - name: Launch build instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        name: baseline_build
        image_id: "{{ base_ami }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ vpc_subnet_id }}"
        security_group: "{{ sg_id }}"
        network:
          assign_public_ip: true
        state: running
        wait: true
      register: build_instance

    - name: Add to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ build_instance.instances[0].public_ip_address }}"
        groups: build
        ansible_user: ubuntu
        instance_id: "{{ build_instance.instances[0].instance_id }}"

    - name: Wait for SSH
      ansible.builtin.wait_for:
        host: "{{ build_instance.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300

- name: Apply baseline 
  hosts: build
  become: true
  roles:
    - baseline

- name: Reboot for safe measure
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Restart EC2
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids: "{{ hostvars[groups['build'][0]]['instance_id'] }}"
        state: restarted
    - name: Wait for SSH to be up
      ansible.builtin.wait_for:
        host: "{{ build_instance.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300

- name: Bake and clean
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create AMI
      amazon.aws.ec2_ami:
        region: "{{ aws_region}}"
        instance_id: "{{ hostvars[groups['build'][0]]['instance_id'] }}"
        name: "ubuntu-24.04-baseline-{{ ansible_date_time.iso8601_basic_short | default(lookup('pipe','date +%Y%m%d%H%M')) }}"
        wait: true
        tags:
          Baseline: "True"
          BuiltBy: "ansible - pstu"
          SourceAMI: "{{ base_ami }}"
      register: new_ami

    - name: Terminate build instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids: "{{ hostvars[groups['build'][0]]['instance_id'] }}"
        state: absent
        wait: true
